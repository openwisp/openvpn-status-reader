name: Replicate Commits to Version Branch

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  version-branch:
    uses: openwisp/openwisp-utils/.github/workflows/reusable-version-branch.yml@c2a620fb23a2fb00b2bcf6da1e80bba8c7899ec0
    with:
      module_name: openvpn_status.version
      client_id: ${{ vars.OPENWISP_BOT_CLIENT_ID }}
      install_package: true
    secrets:
      private_key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
