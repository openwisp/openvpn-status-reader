name: OpenWISP CI Build

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade -r requirements-test.txt
          python -m pip install --editable .

      - name: QA checks
        if: matrix.python-version == '3.13'
        run: ./run-qa-checks

      - name: Tests
        run: pytest --cov-report=xml

      - name: Upload coverage
        if: success()
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel: true
          format: cobertura
          flag-name: python-${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true
