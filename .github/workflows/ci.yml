name: OpenVPN Status Reader CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - python-version: "3.13"
            review_default: true # Used by on-demand AI reviews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache pip downloads
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                hashFiles('requirements-test.txt', 'setup.py', 'install-ci-deps.sh')) }}

      - name: Install dependencies
        id: deps
        run: ./install-ci-deps.sh

      - name: QA checks
        if: matrix.python-version == '3.13'
        run: ./run-qa-checks

      - name: Tests
        run: ./runtests --cov-report=xml

      - name: Upload coverage
        if: success()
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel: true
          format: cobertura
          flag-name: python-${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true
